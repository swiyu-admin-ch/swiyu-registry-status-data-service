services:
  postgres:
    image: postgres:17.8
    hostname: localhost
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "secret"
      POSTGRES_DB: "status-registry-db"
    ports:
      - "5290:5432"
